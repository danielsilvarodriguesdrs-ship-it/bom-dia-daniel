name: bom-dia-daniel

on:
  schedule:
    # Disparo principal: cron-job.org chama workflow_dispatch às 05:28 BRT (pontual).
    # Este schedule é só reserva — o GitHub costuma atrasar horas.
    - cron: "28 8 * * *"       # 08:28 UTC = 05:28 America/Sao_Paulo
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bom-dia-daniel
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: America/Sao_Paulo
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
      FINANCE_URL:        ${{ secrets.FINANCE_URL }}
      SUPABASE_URL:       ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY:  ${{ secrets.SUPABASE_ANON_KEY }}
      FINANCE_BRIEF_KEY:  ${{ secrets.FINANCE_BRIEF_KEY }}
      SPOTIFY_CLIENT_ID:     ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
      GOOGLE_CLIENT_ID:     ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN_PESSOAL:   ${{ secrets.GOOGLE_REFRESH_TOKEN_PESSOAL }}
      GOOGLE_REFRESH_TOKEN_CAMPOFORT: ${{ secrets.GOOGLE_REFRESH_TOKEN_CAMPOFORT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar se o resumo de hoje já foi enviado
        id: trava
        if: github.event_name == 'schedule'
        run: |
          if [ "$(git log -1 --format=%s)" = "resumo matinal $(date +%F)" ]; then
            echo "Resumo de hoje já enviado — encerrando sem duplicar."
            echo "enviado=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Gerar e enviar o resumo
        if: steps.trava.outputs.enviado != '1'
        run: python brief.py

      - name: Publicar página (GitHub Pages)
        if: steps.trava.outputs.enviado != '1'
        run: |
          git config user.name  "bom-dia-daniel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          git commit -m "resumo matinal $(date +%F)" || echo "sem mudanças"
          git push
