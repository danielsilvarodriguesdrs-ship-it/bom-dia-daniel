name: bom-dia-daniel

on:
  schedule:
    - cron: "0 6 * * *"        # 06:00 UTC = 03:00 America/Sao_Paulo (folga p/ atraso do GH)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bom-dia-daniel
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/Sao_Paulo
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
      FINANCE_URL:        ${{ secrets.FINANCE_URL }}
      SPOTIFY_CLIENT_ID:     ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
      GOOGLE_CLIENT_ID:     ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN_PESSOAL:   ${{ secrets.GOOGLE_REFRESH_TOKEN_PESSOAL }}
      GOOGLE_REFRESH_TOKEN_CAMPOFORT: ${{ secrets.GOOGLE_REFRESH_TOKEN_CAMPOFORT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Gerar e enviar o resumo
        run: python brief.py

      - name: Publicar página (GitHub Pages)
        run: |
          git config user.name  "bom-dia-daniel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          git commit -m "resumo matinal $(date +%F)" || echo "sem mudanças"
          git push
